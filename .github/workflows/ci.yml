name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: the jobs only read the repo.
permissions:
  contents: read

# Cancel superseded runs on a PR branch; never cancel a push to main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static + unit gates — run once.
  checks:
    name: lint, typecheck, build, unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome — fails on any warning or error)
        run: pnpm lint

      - name: Typecheck (src + tests + configs)
        run: pnpm typecheck

      - name: Build (ESM + UMD + types)
        run: pnpm build

      - name: Unit tests + coverage (vitest)
        run: pnpm coverage

  # Phase 39 Group E — three-engine functional gate. The functional/contract
  # suite runs on Chromium + Firefox + WebKit as PARALLEL matrix legs (not serial
  # under one runner). All three are required-for-merge. Pixel/visual baselines
  # are Chromium-only (Group F, a separate Docker job) — the visual spec is
  # ignored on the Firefox/WebKit projects in playwright.config.ts.
  e2e:
    name: e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # 30 min: WebKit (slowest engine) + a cold browser cache + --with-deps apt
    # install overran the previous 20-min ceiling before workers:2 landed.
    timeout-minutes: 30
    strategy:
      fail-fast: false # surface every engine's result, don't cancel siblings
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser (${{ matrix.browser }})
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser + OS deps (${{ matrix.browser }})
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: pnpm build

      - name: E2E (${{ matrix.browser }})
        run: pnpm exec playwright test --project=${{ matrix.browser }}

      # Diagnostics for cross-engine failures: the HTML report + on-retry traces
      # / screenshots, so a failing engine can be inspected without a local
      # browser of that kind.
      - name: Upload Playwright report + traces on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
