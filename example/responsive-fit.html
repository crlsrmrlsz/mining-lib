<!doctype html>
<!--
  Responsive-fit demo. Kept with the inline embedder-side count-mode +
  theme-toggle controls because the responsive-fit e2e spec
  (tests/e2e/responsiveFit.spec.ts) and earlier zoom/pan specs
  drive them deterministically. For the bundled
  toolbar via example/control-bar.html.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mining-lib — responsive fit (dev)</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        font-family: system-ui, sans-serif;
        color: #1a1a1a;
      }
      h1 {
        font-size: 1rem;
        font-weight: 500;
        margin: 0;
        color: #555;
      }
      .hint {
        font-size: 0.85rem;
        color: #666;
        margin: 0;
      }
      .controls {
        font-size: 0.9rem;
        color: #555;
      }
      .controls select,
      .controls button {
        margin-left: 0.5rem;
        padding: 0.25rem 0.6rem;
        font-size: 0.9rem;
        border: 1px solid #ddd;
        background: #fff;
        color: inherit;
        border-radius: 4px;
        cursor: pointer;
      }
      .controls button:hover {
        background: #f5f5f5;
      }
      /* Default: canvas always fills the remaining viewport.
         When ?w/?h are set, JS switches to flex 0 0 auto + fixed
         pixel size (used by the responsive-fit e2e for deterministic sizing). */
      #mount {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      #mount mining-lib-diagram {
        flex: 1 1 auto;
        border: 1px solid #ddd;
      }
    </style>
  </head>
  <body>
    <h1>mining-lib · responsive fit-to-view (ESM source)</h1>
    <p class="hint">
      URL params: <code>?w=800&amp;h=600</code> sets the host pixel
      size; <code>?fixture=n5-fixture</code> (default) or
      <code>?fixture=n1000-realistic</code>;
      <code>?topK=N</code> sets the variant-panel default selection.
    </p>
    <div class="controls">
      <label for="count-mode">Count mode:</label>
      <select id="count-mode">
        <option value="absolute">Absolute frequency</option>
        <option value="case">Case frequency</option>
        <option value="maxRepetitions">Max repetitions</option>
        <option value="meanRepetitions">Mean repetitions</option>
      </select>
      <button type="button" id="dark-toggle">Toggle dark mode</button>
    </div>
    <div id="mount"></div>
    <script type="module">
      import { buildDfg, createDiagram, parseCsv } from "mining-lib";

      const params = new URLSearchParams(location.search);
      const w = Number(params.get("w"));
      const h = Number(params.get("h"));
      const mount = document.getElementById("mount");
      if (Number.isFinite(w) && w > 0 && Number.isFinite(h) && h > 0) {
        mount.style.flex = "0 0 auto";
        mount.style.width = `${w}px`;
        mount.style.height = `${h}px`;
      }

      const parsedTopK = Number(params.get("topK"));
      const config =
        Number.isInteger(parsedTopK) && parsedTopK >= 1 ? { variantTopK: parsedTopK } : {};

      const handle = createDiagram("#mount", config);
      window.__diagram = handle;
      window.__el = document.querySelector("#mount > mining-lib-diagram");
      window.__mount = mount;

      const fixture = params.get("fixture") ?? "n5-fixture";
      const response = await fetch(`/runs/${fixture}/events.csv`);
      const text = await response.text();
      const { log } = parseCsv(text);
      const dfg = buildDfg(log);
      handle.render(dfg, log);

      document.getElementById("count-mode").addEventListener("change", (event) => {
        handle.setCountMode(event.target.value);
      });

      document.getElementById("dark-toggle").addEventListener("click", () => {
        const t = handle.getTheme();
        handle.setTheme({ dark: !t.dark });
        document.body.style.background = t.dark ? "" : "#000";
        document.body.style.color = t.dark ? "" : "#fafafa";
      });
    </script>
  </body>
</html>
